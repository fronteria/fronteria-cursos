name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true
      - name: Build
        run: hugo --minify --baseURL 'https://cursos.fronteria.co/'
      - name: Check public files
        run: |
          if find public -type f | grep -E 'CLAVE_instructor|~lock|\.zip$'; then
            echo 'Se detectaron archivos privados o temporales en public/'
            exit 1
          fi
          test "$(find public/recursos/ia-logistica-comercio-internacional/fundamentos/ejercicios -type f | wc -l)" -eq 7
          test -f public/recursos/ia-logistica-comercio-internacional/fundamentos/cuaderno/cuaderno-participante.pdf
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
